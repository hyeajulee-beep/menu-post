name: menu-to-slack

on:
  schedule:
    # UTC 기준. 외부 스케줄러(cron-job.org)가 주 트리거이고, 아래는 그것이 실패/누락될
    # 때를 위한 백업이다. 스크립트가 --once(1회 조회 후 종료)로 돌므로 각 run이 수초~90초
    # 내 끝난다 — 메뉴 창(window) 동안 여러 번 짧게 발동해 커버한다. 이미 전송됐으면
    # 멱등성(채널 기록 확인)으로 자동 skip되어 중복이 나지 않는다.
    # (GitHub cron은 몇 분~수십 분 지연될 수 있어 정시 커버는 외부 스케줄러가 담당)
    - cron: '0,15,30,45 2 * * 1-5'      # 중식 백업 — 11:00~11:45 KST 15분 간격
    - cron: '0,15,30,45 3 * * 1-5'      # 중식 백업(연장) — 12:00~12:45 KST
    - cron: '15,30,45 8 * * 1-5'        # 석식 백업 — 17:15~17:45 KST 15분 간격
    - cron: '0,15,30,45 9 * * 1-5'      # 석식 백업 — 18:00~18:45 KST 15분 간격
    - cron: '0 10 * * 1-5'              # 석식 백업(연장) — 19:00 KST
  workflow_dispatch:
    inputs:
      meal:
        description: '어느 끼니를 보낼지'
        required: true
        default: lunch
        type: choice
        options:
          - lunch
          - dinner
  # 외부 스케줄러(cron-job.org 등)가 메뉴 창 동안 10분 간격으로 호출하는 주 트리거.
  # GitHub 자체 크론이 정시에 잘 안 떠서 도입. event_type(lunch/dinner)으로 끼니 지정.
  # 각 호출마다 스크립트가 --once로 1회 조회 후 종료하고, 멱등성으로 중복 전송을 막는다.
  repository_dispatch:
    types: [lunch, dinner]

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Determine meal
        id: meal
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "meal=${{ inputs.meal }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "meal=${{ github.event.action }}" >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Asia/Seoul date +%H)
            if [ "$hour" -lt 14 ]; then
              echo "meal=lunch" >> "$GITHUB_OUTPUT"
            else
              echo "meal=dinner" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Send menu to Slack
        run: python menu_to_slack.py --meal "${{ steps.meal.outputs.meal }}" --once
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

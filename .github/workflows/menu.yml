name: menu-to-slack

on:
  schedule:
    # UTC 기준. 외부 스케줄러(cron-job.org)가 빠른 정상 경로이고, 아래 GitHub 크론은 그것이
    # 실패/누락될 때의 '자립형 백스톱'이다. GitHub 크론은 발동 자체가 지연·누락되기 쉬우므로
    # (촘촘히 깔아도 하나도 안 뜰 수 있음), schedule로 뜬 run은 --once(1회 조회)가 아니라
    # 바운드 폴링(--no-wait --max-wait 50)으로 돈다 — 창 초입에 '한 번만' 떠도 카카오 게시
    # 시점까지 폴링해 잡는다. 이미 전송됐으면 멱등성(채널 기록 확인)으로 즉시 skip해 중복 없음.
    # 창 초입을 5분 간격으로 촘촘히 깐다 — 11:00 크론이 드롭돼도 11:05가 폴링을 시작하도록.
    # 어느 하나가 뜨면 그 run이 50분 폴링으로 나머지를 덮고, 뒤이어 뜬 크론은 concurrency로
    # 큐잉됐다 already_sent로 빠르게 skip하므로 촘촘해도 러너 낭비가 없다.
    # 주의: 끼니는 아래 'Determine meal' 스텝이 크론 문자열의 시(hour) 필드로 매핑한다
    # (2시=중식, 8·9시=석식). 크론 시각을 바꾸면 그 매핑도 같이 고칠 것.
    - cron: '0,5,10,15,20,40 2 * * 1-5' # 중식 백스톱 — 11:00~11:20 5분 간격 + 11:40 → 각 50분 폴링
    - cron: '30,35,40,45,50 8 * * 1-5'  # 석식 백스톱 — 17:30~17:50 5분 간격 → 각 50분 폴링
    - cron: '10 9 * * 1-5'              # 석식 백스톱 — 18:10 KST 진입 → 50분 폴링
  workflow_dispatch:
    inputs:
      meal:
        description: '어느 끼니를 보낼지'
        required: true
        default: lunch
        type: choice
        options:
          - lunch
          - dinner
      resend:
        description: '기존 메시지 삭제 후 재전송'
        required: false
        default: false
        type: boolean
      date:
        description: '대상 날짜 YYYY-MM-DD (비우면 오늘). 누락된 끼니를 다음날 늦게 보낼 때'
        required: false
        default: ''
        type: string
  # 외부 스케줄러(cron-job.org 등)가 메뉴 창 동안 10분 간격으로 호출하는 주 트리거.
  # GitHub 자체 크론이 정시에 잘 안 떠서 도입. event_type(lunch/dinner)으로 끼니 지정.
  # 각 호출마다 스크립트가 --once로 1회 조회 후 종료하고, 멱등성으로 중복 전송을 막는다.
  repository_dispatch:
    types: [lunch, dinner]

# 중식·석식 창은 시간대가 겹치지 않으므로 워크플로 전체에 단일 그룹이면 충분하다.
# cancel-in-progress: false — 폴링 중인 백스톱 run을 죽이지 않고, 뒤에 겹친 트리거는
# 큐잉됐다가 already_sent로 빠르게 skip → 러너 다중 점유 방지.
concurrency:
  group: menu-to-slack
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # 백스톱 바운드 폴링(최대 50분) + 시작 오버헤드를 수용. --once/dispatch는 수초 내 끝난다.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Determine meal and run mode
        id: meal
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          # 끼니 결정. schedule은 발동 시각이 아니라 '어느 크론이 발동했는지'
          # (github.event.schedule)로 판정한다 — 이 repo의 schedule은 상시 2~2.6시간
          # 지연 배달되므로, 시각 기반이면 중식 백스톱이 14시 이후 도착해 dinner로
          # 오판된다 (2026-07-21~08-05 관측: 중식 백스톱이 이 버그로 한 번도 못 보냄).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "meal=${{ inputs.meal }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "meal=${{ github.event.action }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              *' 2 * * '*) meal=lunch ;;
              *' 8 * * '*|*' 9 * * '*) meal=dinner ;;
              *)
                # 새 크론 추가 후 매핑 누락 시에만 쓰는 폴백(시각 기반, 지연에 취약)
                hour=$(TZ=Asia/Seoul date +%H)
                if [ "$hour" -lt 14 ]; then meal=lunch; else meal=dinner; fi
                ;;
            esac
            echo "meal=$meal" >> "$GITHUB_OUTPUT"
          fi
          # 실행 모드
          #  - schedule(최후 백스톱): 50분 바운드 폴링. 타임아웃 시 본식이 없어도 발견분 전송
          #  - repository_dispatch(주 경로): 8분 바운드 폴링. 발견 즉시 종료하므로 보통 수초.
          #    외부 스케줄러가 단발로 발동해도 창 초입 8분은 이 run 하나가 덮는다 —
          #    2026-07-27 중식은 11:00:34 단발 조회가 11:03 게시를 3분 차로 놓쳐 누락됐다.
          #    10분 간격이 정상 동작할 땐 창이 겹치지 않고 타일링돼 러너 낭비도 없다.
          #  - workflow_dispatch(수동): 즉시 끝나야 하므로 --once. resend=true면 기존
          #    메시지를 지우고 다시 보낸다(이미지 누락 등으로 재전송이 필요할 때).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=--no-wait --max-wait 50 --allow-partial" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "mode=--no-wait --max-wait 8" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.resend }}" = "true" ]; then
            echo "mode=--once --resend" >> "$GITHUB_OUTPUT"
          else
            echo "mode=--once" >> "$GITHUB_OUTPUT"
          fi
          # 수동 실행의 대상 날짜 지정(지연 전송). 입력은 env로 받아 셸 주입을 막고 형식을 검사한다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$DATE_INPUT" ]; then
            if ! echo "$DATE_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "date 입력 형식 오류(YYYY-MM-DD): $DATE_INPUT" >&2; exit 1
            fi
            echo "date=--date $DATE_INPUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Send menu to Slack
        run: python menu_to_slack.py --meal "${{ steps.meal.outputs.meal }}" ${{ steps.meal.outputs.mode }} ${{ steps.meal.outputs.date }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # 선택(폴백): 게시 대상은 봇이 초대된 채널 전부를 매 실행 때 조회한다.
          # 토큰에 channels:read/groups:read가 없는 경우에만 이 채널 하나로 폴백.
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

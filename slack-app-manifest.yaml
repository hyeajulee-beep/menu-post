display_information:
  name: 메뉴봇
  description: 구내식당 중식/석식 메뉴를 채널에 올려주는 봇
features:
  bot_user:
    display_name: 메뉴봇
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - channels:history
      - groups:history
      - channels:read
      - groups:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
